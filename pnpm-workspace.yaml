packages:
  - apps/*
  - packages/*

# pnpm 11 reads its settings from THIS file, not from .npmrc. Do not add an .npmrc
# expecting pnpm to honour it.

# Which dependencies may run install scripts. Everything else is blocked, which is the
# behaviour we want: an install script is arbitrary code execution at `pnpm install` time.
# `pnpm install` prints any newly-ignored package; add it here with a deliberate answer
# rather than approving interactively.
allowBuilds:
  # Needs its postinstall to place the platform binary.
  esbuild: true
  # All three arrive via testcontainers -> dockerode -> ssh2, are dev-only, and their build
  # scripts only compile optional native speedups. Not worth a toolchain on Windows.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # msw's postinstall only copies `mockServiceWorker.js` into a public directory, which is for
  # intercepting in a real browser. We use `msw/node` in Vitest, so there is nothing to place.
  msw: false
  # Cloudflare's local Workers runtime, which arrived via wrangler. `wrangler` itself was removed on
  # 2026-07-30 (debt D30) because no script ever invoked it — Pages builds through the dashboard's git
  # integration. This entry stays as a cheap guard: if wrangler is ever added back for a local
  # `pages dev`, its postinstall would otherwise pull a ~100MB platform binary silently.
  workerd: false

# `pnpm deploy` (used by apps/api/Dockerfile) refuses to run without this.
injectWorkspacePackages: true

# pnpm 11 refuses packages published very recently, as supply-chain protection. This exclusion
# was added automatically for a fresh major of jsdom. It is dev-only — the Vitest DOM
# environment, never shipped — which is the only reason it is acceptable to wave through.
minimumReleaseAgeExclude:
  - jsdom@30.0.0

# Default is "install", which reaches the registry on every `pnpm run`. Turbo and vitest are
# run constantly; the check is not worth the latency or the offline failure mode.
verifyDepsBeforeRun: false
