# Test + build + deploy the API, triggered by a GitHub push webhook.
#
# WHY THIS EXISTS INSTEAD OF GITHUB ACTIONS
# GitHub Actions is blocked at the account level on this repository: every run dies in seconds
# with no runner assigned, no steps and no logs (conventions/testing.md §7). `.github/workflows/ci.yml`
# is kept and still correct — if Actions is ever unblocked it takes over and this file can go.
#
# WHY IT RUNS THE TESTS
# A plain "build and deploy on push" trigger would ship untested code. The GitHub Actions job it
# replaces was gated on `needs: verify` precisely so that could not happen, and dropping that gate
# was the main cost of moving here. So the gate is reproduced below: typecheck, lint and the full
# test suite — against a REAL Postgres — must pass before the image is built.
#
# The steps run sequentially by default; each `waitFor` is left implicit except where a step must
# not block.
#
# Manual run (uses the current main):
#   gcloud builds submit --config cloudbuild.deploy.yaml --substitutions=_SHA=$(git rev-parse HEAD)

substitutions:
  _REGION: us-central1
  _REPO: life-manager
  _IMAGE: api
  _SERVICE: life-manager-api
  _RUNTIME_SA: life-manager-api@life-manager-01.iam.gserviceaccount.com
  # Overridden by the webhook trigger from the push payload.
  _SHA: main
  # Also from the payload. A webhook trigger cannot filter on branch (this gcloud has no
  # `--filter` for `triggers create webhook`), so the guard step below does it instead.
  _REF: refs/heads/main
  # The commit main pointed at BEFORE this push — GitHub's push payload `before`. Mapped by the
  # trigger as `$(body.before)`; empty here so a manual `gcloud builds submit` still works.
  #
  # This is the fix for debt D62. `${_SHA}` alone identifies only the TIP of the push, and a
  # fast-forward push of N commits still has one tip — so the old `HEAD~1..HEAD` diff examined one
  # commit out of nine and skipped an API deploy whose changes were sitting behind it. `before..after`
  # is the actual pushed range, which is the only range that answers "did this push touch the API".
  #
  # ⚠ It arrives EMPTY until the trigger is recreated with the mapping (debt **D25**: the trigger
  # holds its own inline copy of this file and `gcloud builds triggers update webhook` cannot
  # replace it — the trigger must be DELETED AND RECREATED). Until then the guard falls back, and
  # the fallback is documented and safe. See README.md § Deploying.
  _BEFORE: ''

steps:
  # ── source ────────────────────────────────────────────────────────────────────────────────
  # Cloned rather than supplied by the trigger: a webhook trigger has no repo attached, and the
  # repository is public so this needs no credential.
  #
  # --depth 2, not 1: the guard below needs the tip's parents. On a merge commit the first parent is
  # the previous main, so a first-parent diff is exactly the merged work.
  #
  # The push's before-SHA is fetched separately when the trigger supplies it, because it can be any
  # distance back and is not an ancestor of anything we already have at depth 2. A two-tree
  # `git diff <before> <head>` needs only both commit objects present, not the history between them,
  # so --depth 1 is enough for it.
  - id: clone
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        git init -q .
        git remote add origin https://github.com/mevivek/life-manager.git
        git fetch -q --depth 2 origin "${_SHA}"
        git checkout -q FETCH_HEAD
        echo "checked out $(git rev-parse --short HEAD)"
        # Fetched AFTER the checkout so FETCH_HEAD is not clobbered before it is used. A failure here
        # is not fatal — a force-push can remove the before-SHA — the guard just loses its best base.
        if [ -n "${_BEFORE}" ] && [ "${_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
          git fetch -q --depth 1 origin "${_BEFORE}" \
            || echo "could not fetch before-SHA ${_BEFORE} — the guard will fall back"
        fi

  # ── always-run checks: no database, no install, no guard ──────────────────────────────────
  # Deliberately placed BEFORE the guard and with no `/workspace/SKIP` check, so it runs on every
  # push including a doc-only one and including a feature branch. Two reasons it belongs here rather
  # than in the `test` step:
  #
  #  1. The guard writes SKIP for a doc-only commit, and every step after it exits 0. A check that
  #     only runs when a deploy is happening cannot catch the class of defect where the deploy is
  #     being skipped for the wrong reason.
  #  2. `check-schema-barrel.mjs` uses Node builtins only — no `pnpm install`, no Postgres — so it
  #     costs seconds. Its database-backed counterpart (`migrations.test.ts`) SKIPS wherever no
  #     Postgres is reachable (ADR-0018), which is where a table is most likely to be added without
  #     the barrel re-export that makes it real.
  #
  # This one DOES fail the build, unlike the guard. A table missing from the barrel is invisible to
  # drizzle-kit, so it is missing in production while every local test passes — that is a defect, not
  # a "nothing to deploy".
  - id: checks
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', 'node scripts/check-schema-barrel.mjs']

  # ── guard: right branch, and something worth deploying ────────────────────────────────────
  # Two independent reasons to skip, both writing the same marker. Cloud Build has no native
  # early-exit, so later steps check for /workspace/SKIP.
  #
  # 1. GitHub sends a push webhook for EVERY branch. Deploying a feature branch to production
  #    would be actively harmful.
  # 2. Doc-only commits are frequent in this repository and rebuilding for them is pure waste —
  #    it burns build minutes and churns Artifact Registry, whose policy keeps only 3 images.
  #
  # It exits 0 either way. A skipped deploy is the CORRECT outcome, and failing the build for it
  # would train everyone to ignore red.
  #
  # ── DEBT D62: what the diff base has to be, and why HEAD~1 was wrong ──
  #
  # This step used to diff `HEAD~1..HEAD`. That is right for a MERGE commit and wrong for a
  # FAST-FORWARD, and the comment here said as much without noticing the second half. `${_SHA}` is
  # the pushed TIP; a fast-forward push of N commits has exactly one tip, so N-1 commits were never
  # examined. On 2026-07-30 a `--ff-only` merge landed 9 commits whose tip was web+docs, the guard
  # skipped, and three commits behind it had added a field to the wire contract — the client then
  # required a key the deployed API had never sent, and the Documents archive and the Now screen both
  # failed to load. A skipped deploy is not a cheap mistake.
  #
  # Three bases, in descending order of correctness. The first is the real fix; the others are
  # honest about what they can and cannot know:
  #
  #  1. `${_BEFORE}..HEAD` — the ACTUAL pushed range. Correct for any push shape, any depth.
  #  2. `HEAD^1..HEAD` when the tip is a merge commit — the first parent IS the previous main, so
  #     this is exactly the merged work. This is the case the old code was written for and the case
  #     `--no-ff` (D62's interim mitigation) guarantees, so it stays supported.
  #  3. Otherwise — a non-merge tip with no before-SHA — the pushed range is genuinely NOT derivable
  #     from the repository. So DEPLOY. A needless deploy costs build minutes and one Artifact
  #     Registry slot; a wrongly skipped one caused the outage above. The doc-only optimisation is
  #     forfeited in exactly this case and returns as soon as `_BEFORE` is supplied.
  - id: guard
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        if [ "${_REF}" != "refs/heads/main" ]; then
          echo "ref ${_REF} is not main — nothing to deploy."
          touch /workspace/SKIP
          exit 0
        fi

        # Lowercase shell variables on purpose. Cloud Build resolves every dollar-prefixed
        # upper-case name in this file — braced or not — as a substitution BEFORE bash sees the
        # script, so an upper-case shell variable would need its dollar doubled to survive.
        # Lower-case names are never touched.
        #
        # And note WHERE that applies: a `#` comment inside a `|` block is part of the step's args,
        # not a YAML comment, so writing the offending token here even as an example is enough to
        # have the whole config REJECTED before step one — which is exactly what happened on
        # 2026-07-31 (debt D82). `scripts/check-cloudbuild-subs.mjs` now fails `pnpm lint` on it.
        base=""
        if [ -n "${_BEFORE}" ] \
           && [ "${_BEFORE}" != "0000000000000000000000000000000000000000" ] \
           && git cat-file -e "${_BEFORE}^{commit}" 2>/dev/null; then
          base="${_BEFORE}"
          echo "diffing the whole pushed range ${_BEFORE}..HEAD"
        elif [ "$(git cat-file -p HEAD | grep -c '^parent ')" -ge 2 ]; then
          base="HEAD^1"
          echo "no before-SHA, but the tip is a merge commit — HEAD^1..HEAD is the merged work"
        else
          echo "cannot determine the pushed range: no usable _BEFORE and the tip is not a merge."
          echo "A fast-forward push of N commits would leave N-1 unexamined (debt D62), so this"
          echo "deploys rather than guessing. Map _BEFORE to the push payload's before field on"
          echo "the trigger to restore the doc-only skip — and note debt D25: the trigger must be"
          echo "DELETED AND RECREATED, an update cannot replace its inline config."
          exit 0
        fi

        if git diff --quiet "$base" HEAD -- \
             apps/api packages/shared cloudbuild.deploy.yaml apps/api/Dockerfile \
             pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json; then
          echo "no changes to the API, shared package, or build inputs — skipping."
          touch /workspace/SKIP
        else
          echo "API-relevant changes found:"
          git diff --name-only "$base" HEAD -- \
            apps/api packages/shared cloudbuild.deploy.yaml apps/api/Dockerfile \
            pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json
        fi

  # ── a real Postgres for the API integration tests ─────────────────────────────────────────
  # Detached, on the `cloudbuild` network, so later steps reach it as host `postgres`.
  # ADR-0018: these suites SKIP without a database, so without this the tests would pass while
  # testing nothing — which is worse than failing.
  - id: postgres
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --network=cloudbuild
      - --name=postgres
      - -e
      - POSTGRES_PASSWORD=postgres
      - -e
      - POSTGRES_DB=lm_test
      - postgres:17-alpine

  - id: install
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ -f /workspace/SKIP ]; then echo "skipped by guard"; exit 0; fi
        corepack enable pnpm
        pnpm install --frozen-lockfile
    env:
      - CI=true

  - id: typecheck
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', '[ -f /workspace/SKIP ] && exit 0; corepack enable pnpm && pnpm typecheck']
    env: ['CI=true']

  - id: lint
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', '[ -f /workspace/SKIP ] && exit 0; corepack enable pnpm && pnpm lint']
    env: ['CI=true']

  # `pnpm test` carries two guardrails worth naming, because a future edit that narrows this step
  # would silently disarm them:
  #
  #  • `packages/shared/src/contract.test.ts` — every RESPONSE field must tolerate an older server
  #    omitting it (debt D54). It needs no database, and it is safe for it to live behind the guard
  #    rather than in the `checks` step above: `packages/shared` is one of the paths the guard diffs,
  #    so a commit that can trip this test can never be one the guard skips.
  #  • `apps/api/src/db/migrations.test.ts` — the schema barrel and `information_schema` must agree
  #    about every table, in both directions. This one needs the sidecar below, hence `CI=true`.
  - id: test
    name: node:22-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ -f /workspace/SKIP ]; then echo "skipped by guard"; exit 0; fi
        corepack enable pnpm
        # Wait for the sidecar; `pg_isready` is not in this image, so probe the port.
        for i in $(seq 1 30); do
          nc -z postgres 5432 && break
          echo "waiting for postgres ($i)"; sleep 2
        done
        pnpm test
    env:
      # CI=true makes the harness THROW rather than skip when no database is reachable, so a
      # broken sidecar fails the build instead of silently passing.
      - CI=true
      - TEST_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/lm_test

  # ── image ─────────────────────────────────────────────────────────────────────────────────
  # Built from the REPO ROOT: the Dockerfile needs pnpm-lock.yaml, pnpm-workspace.yaml and
  # packages/shared. BuildKit is required for its `RUN --mount=type=cache` lines.
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ['DOCKER_BUILDKIT=1']
    args:
      - -c
      - |
        set -euo pipefail
        if [ -f /workspace/SKIP ]; then echo "skipped by guard"; exit 0; fi
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}
        docker build --file=apps/api/Dockerfile --tag=$$IMG:${_SHA} --tag=$$IMG:latest .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -f /workspace/SKIP ]; then echo "skipped by guard"; exit 0; fi
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

  # ── deploy ────────────────────────────────────────────────────────────────────────────────
  # --min-instances=0 is load-bearing: 180k vCPU-seconds/month cannot cover an always-on
  # instance, so it is the difference between free and billed (ADR-0021).
  # Secrets are NOT set here — they are already bound to the service from Secret Manager, read by
  # the runtime account. This build's identity cannot read them.
  # The branch guard is enforced HERE rather than on the earlier steps. Testing and building a
  # feature branch is harmless — wasted minutes at worst. *Deploying* one to production is not.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -f /workspace/SKIP ]; then echo "not main — skipping deploy"; exit 0; fi
        gcloud run deploy ${_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_SHA} \
          --region=${_REGION} --platform=managed \
          --service-account=${_RUNTIME_SA} \
          --min-instances=0 --max-instances=3 \
          --update-env-vars=APP_VERSION=${_SHA} \
          --quiet

  # A deploy that "succeeded" while serving 500s is not a successful deploy.
  - id: verify
    name: gcr.io/cloud-builders/curl
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        if [ -f /workspace/SKIP ]; then echo "not main — nothing was deployed"; exit 0; fi
        for i in $(seq 1 12); do
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.mevivek.dev/api/v1/health || true)
          if [ "$code" = "200" ]; then
            echo "health 200"; curl -s https://api.mevivek.dev/api/v1/health; exit 0
          fi
          echo "attempt $i: $code"; sleep 10
        done
        echo "API did not return 200 after deploy"; exit 1

options:
  # Required when the build runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY
  # No machineType set, deliberately: Cloud Build's 120 free build-minutes/day apply only to
  # the default machine type. E2_HIGHCPU_8 was billed from the first minute with no free
  # allowance at all. The last real (non-skipped) build on that tier took 4m25s against this
  # file's 2400s timeout, so the default machine has plenty of headroom even if it runs
  # several times slower.

timeout: 2400s
